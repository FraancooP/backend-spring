spring.application.name=Backend
#
dev.info.enabled=true
#Modo por tabulaciones(yamble):
#spring:
#	aplication:
#		name: Backend
#Definicion de propiedades para conectarnos a la base de datos:
#Definimos nuestro datasource con url jdbc, estos parametros salen de la documentacion de mysql
spring.datasource.url=jdbc:mysql://localhost:33306/iw3_2025?createDatabaseIfNotExist=true&verifyServerCertificate=false&useSSL=false&allowPublicKeyRetrieval=true
#Usuario  y password de la base de datos
spring.datasource.username=iw3
spring.datasource.password=iw3pass
#Circuito de carga de los drivers de jdbc(es una parte del gigante circuito), le decimos que clase maneja la conexion con mysql
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
#Spring utiliza tecnologia OMR(Mapeadores objetos relacionales) le decimos que dialecto tiene que utilizar para comunicarse con el SGBD 
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#jpa es una especificacion de como percistir objetos en java.

#Le decimos como se comporta hibernet a la hora de generar ddl(ddl = data definition language)
#Vamos mapeando las clases a tablas de una BD relacional de mysql.
#Crea las instrucciones automaticamente y las ejecuta, el modo update calcula lo que tenemos y lo hay en
#la bd y calcula la diferencia
spring.jpa.hibernate.ddl-auto=update
#Tenemos varios valores, algunos son:
#update = modifica el esquema destino si es necesario
#create = cada vez que se botea la app, crea el esquema en mysql y los datos previos
#create-drop = lo mismo que el anterior pero cuando se termina borra todo
#create-only = trata de crear el esquema, pero si existe da error.
#drop = borra el esqeuma....
#truncate = borra todas las filas de una tabla.
#validate = le dice cual es el delta(la diferencia)




#Todo lo que empieza con logging hace referencia al sistema de logging, los niveles de log, colocan su nivel entre
#debug, error, fatal, info off.
#ES POR JERARQUIA: 
#1)fatal = es algo que siempre voy a ver
#2)error =
#3)warn =
#4)info =
#5)trace =


#Cuando se define el nivel de log ERROR, significa que vemos de ahi a la izquierda, osea ERROR y FATAL y asi dependiendo el nivel que elija
logging.level.org.springframework.orm.jpa=ERROR
logging.level.org.springframework.transaction=ERROR
#Lo hacemos a nivel de paquetes




#Genera estadisticas de uso de como se acceden a las BD(Para poder mejorar las consolas)
spring.jpa.properties.hibernate.generate_statistics=false

#Mas para bajar el nivel de log
logging.level.org.hibernate.stat=WARN
logging.level.org.hibernate.type=WARN


#Es para ver todos los SQL que la maquinaria ORM genera
#Se apagan cuando estamos en produccion
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


#Declaramos que el nivel general de log es WARN
logging.level.root=WARN

#Hikari es un pol de coneciones, intermadiario entre driver y mysql
spring.datasource.hikari.connection-timeout=60000 
spring.datasource.hikari.minimum-idle=10 
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000  
spring.datasource.hikari.max-lifetime=1800000 
spring.datasource.hikari.auto-commit=false

logging.level.com.zaxxer.hikari.HikariConfig=DEBUG 
logging.level.com.zaxxer.hikari=INFO

logging.level.ar.edu.iua.iw3.BackendApplication=DEBUG

spring.jackson.time-zone=America/Argentina/Buenos_Aires

